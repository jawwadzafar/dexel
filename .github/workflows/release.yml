name: Release

# Tag-triggered release for dexel (module github.com/jawwadzafar/dexel/app):
# builds the frontend fresh (failing on drift), runs the Go test suite,
# cross-compiles the server binary for every supported target via
# scripts/build-release.sh, and publishes a GitHub Release with one archive
# per target plus a sha256sums.txt.
#
# ---------------------------------------------------------------------------
# Why this file no longer builds the Rust `companion` crate
# ---------------------------------------------------------------------------
# The previous version of this file built and shipped the legacy Rust/Bevy
# `companion` binary as the release artifact. That binary is frozen (ADR
# 0011: superseded by the Go+WS backend under app/ — see
# docs/upgrade-design.md) and nothing outside this repo's own CI depends on
# a `companion-*` release asset ever having been published; it is a one-time
# legacy-save source for the Go backend's importer, not a shippable product.
# build.yml still compiles it on every push (so the legacy-save import path
# always has a real binary to test against) — that job is untouched. This
# file now ships the actual product: the Go server under app/. Since EMBED-1
# that server carries both static trees inside itself — app/public/ (the
# committed frontend bundle) and app/assets/ (the sprite PNGs) are compiled in
# with go:embed — so each release archive is just the binary plus the licence
# files, with no public/ or assets/ directory beside it.
#
# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
# See scripts/build-release.sh's header for the full target table and the
# single-binary archive layout. Summary: linux/amd64,
# linux/arm64, windows/amd64, windows/arm64 are all CGO_ENABLED=0 and
# cross-compile cleanly from this job's Linux runner. darwin/arm64 needs
# cgo (Cocoa/CoreGraphics) and a real macOS toolchain, so it is built in a
# separate, GATED `release-macos` job below — mirroring this file's
# existing pattern (previously used for macos-arm64 Rust builds): the job
# runs on the one runner this repo has and immediately no-ops with a
# warning, because no runner carrying the `mac` label is registered yet.
# Once one is, flip that job's `runs-on` to `[self-hosted, mac]` and remove
# the no-op guard step — see the job's own comment.
#
# Trigger: push a tag like `v0.1.0`, or run "Release" via workflow_dispatch
# (useful for a dry run / rebuild of the current commit's artifacts without
# cutting a new tag — in that case the release version comes from
# `git describe` instead of a tag name).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release
    runs-on: [self-hosted, darkmirror]
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history/tags for `git describe`

      # ---- frontend: build fresh, fail on drift ----------------------------
      # Same drift check as build.yml's `frontend` job, run again here on
      # purpose: a release must fail if the committed app/public/js/dexel.js
      # bundle doesn't match a fresh build from app/frontend/src, even if
      # build.yml's check on the tagged commit was (for whatever reason)
      # stale or skipped. Post-EMBED-1 this is the last chance to catch it:
      # the bundle is go:embed'd into every shipped binary, so a stale one
      # cannot be noticed or swapped out after the fact.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: npm ci
        working-directory: app/frontend
        run: npm ci

      - name: tsc --noEmit (strict)
        working-directory: app/frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Assert the committed bundle matches a fresh build
        run: |
          if ! git diff --exit-code -- app/public/js/dexel.js app/public/js/dexel.js.map; then
            echo "::error::app/public/js/dexel.js (and/or its .map) is out of date with app/frontend/src/*.ts — a release cannot ship a stale bundle. Run 'npm run build' in app/frontend/ and commit the result." >&2
            exit 1
          fi

      # ---- go: vet + race test ----------------------------------------------
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: go version
        run: go version

      - name: go vet
        working-directory: app
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      # SF-3: same fix as build.yml's `go` job — cgo reads $CC (gcc by
      # default on Linux), not `cc`, so scripts/test-race.sh does the probing,
      # proves the compiler works, and exports CC before running the suite.
      - name: go test -race (scripts/test-race.sh)
        run: bash scripts/test-race.sh

      # ---- version -----------------------------------------------------------
      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      # ---- build + package ----------------------------------------------------
      - name: Build release archives
        env:
          DEXEL_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-release.sh

      - name: List artifacts
        run: |
          ls -la dist/
          echo "--- sha256sums.txt ---"
          cat dist/sha256sums.txt

      # ---- publish -------------------------------------------------------------
      # Same action the previous version of this file used.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: dexel ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # darwin/arm64 — the one target the Linux `release` job above cannot build.
  # app/internal/activity/provider_darwin.go is cgo (Cocoa/CoreGraphics), so a
  # CGO_ENABLED=0 cross-build does not degrade, it fails to LINK; and
  # `cargo tauri build` cannot produce a .dmg off a Mac at all. So this job runs
  # natively on the registered macOS self-hosted runner (labels: self-hosted,
  # macOS, ARM64), gated by the MAC_RUNNER repo variable.
  #
  # Unlike its former self it no longer just attaches the CLI archive: it
  # produces BOTH the darwin CLI tar.gz AND the UNSIGNED Tauri desktop bundle
  # (.dmg), and folds both darwin checksum lines into the release's
  # sha256sums.txt. All of that is scripts/mac-release.sh — the very script the
  # owner runs by hand — so a CI cut and a manual cut are the same recipe
  # (docs/plan/MAC-RELEASE.md §7 "When CI takes over").
  #
  # `needs: release` waits for the linux/windows job to create the GitHub
  # Release and its sha256sums.txt (linux + windows lines). mac-release.sh then
  # downloads that file, merges the two darwin lines (tar.gz AND dmg) in, and
  # re-uploads it, so the published sha256sums.txt ends up covering every
  # target — and install.sh can verify the .dmg against it exactly as it does
  # the tar.gz.
  #
  # UNSIGNED: no APPLE_* secrets are set, so mac-release.sh builds tier 1 — the
  # .dmg is named `dexel-<TAG>-darwin-arm64-unsigned.dmg` and Gatekeeper warns
  # on another machine. install.sh de-quarantines the copy it installs. Signing
  # is a paid-Apple-cert follow-up, not a Phase-2 blocker (F3-design.md §6).
  release-macos:
    name: Build + attach darwin/arm64 (CLI + desktop .dmg)
    if: vars.MAC_RUNNER == 'true'
    needs: release
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4
        with:
          # Full history AND tags: mac-release.sh's provenance guard runs
          # `git tag --points-at HEAD` and must see the tag it is building.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Rust + tauri-cli, mirroring desktop.yml's `desktop-macos` job — the
      # `cargo tauri build` inside mac-release.sh needs both.
      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-macos
          workspaces: desktop/src-tauri

      - name: Install tauri-cli
        run: |
          if ! command -v cargo-tauri >/dev/null; then
            cargo install tauri-cli --version "^2.0.0" --locked
          fi
          cargo tauri --version

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "darwin release version: $version"

      # Build tar.gz + unsigned .dmg, merge checksums, and upload all darwin
      # assets to the tag's release. mac-release.sh reuses the release
      # sha256sums.txt the `release` job already published, merges the darwin
      # lines, and re-uploads it (so no separate checksum step here). The
      # version is passed explicitly; on a tag push HEAD == the tag, so the
      # script's provenance guard is satisfied with no DEXEL_ALLOW_TAG_MISMATCH.
      #
      # Tag pushes only: mac-release.sh needs a vMAJOR.MINOR.PATCH tag that HEAD
      # points at AND an existing release to attach to — neither of which a
      # workflow_dispatch on a branch has. A dispatch run therefore attaches no
      # darwin assets and says so, rather than failing.
      - name: Build + attach darwin CLI archive and desktop .dmg
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/mac-release.sh "${{ steps.version.outputs.version }}"

      - name: Note — non-tag run attaches no darwin assets
        if: github.ref_type != 'tag'
        run: |
          echo "::warning::release-macos builds the darwin CLI archive + desktop .dmg only on a tag push (scripts/mac-release.sh needs a release tag and an existing release). This workflow_dispatch run attached no darwin assets."
