name: Release

# Tag-triggered release for dexel (module github.com/jawwadzafar/dexel/app):
# builds the frontend fresh (failing on drift), runs the Go test suite,
# cross-compiles the server binary for every supported target via
# scripts/build-release.sh, and publishes a GitHub Release with one archive
# per target plus a sha256sums.txt.
#
# ---------------------------------------------------------------------------
# Why this file no longer builds the Rust `companion` crate
# ---------------------------------------------------------------------------
# The previous version of this file built and shipped the legacy Rust/Bevy
# `companion` binary as the release artifact. That binary is frozen (ADR
# 0011: superseded by the Go+WS backend under app/ — see
# docs/upgrade-design.md) and nothing outside this repo's own CI depends on
# a `companion-*` release asset ever having been published; it is a one-time
# legacy-save source for the Go backend's importer, not a shippable product.
# build.yml still compiles it on every push (so the legacy-save import path
# always has a real binary to test against) — that job is untouched. This
# file now ships the actual product: the Go server under app/. Since EMBED-1
# that server carries both static trees inside itself — app/public/ (the
# committed frontend bundle) and app/assets/ (the sprite PNGs) are compiled in
# with go:embed — so each release archive is just the binary plus the licence
# files, with no public/ or assets/ directory beside it.
#
# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
# See scripts/build-release.sh's header for the full target table and the
# single-binary archive layout. Summary: linux/amd64,
# linux/arm64, windows/amd64, windows/arm64 are all CGO_ENABLED=0 and
# cross-compile cleanly from this job's Linux runner. darwin/arm64 needs
# cgo (Cocoa/CoreGraphics) and a real macOS toolchain, so it is built in a
# separate, GATED `release-macos` job below — mirroring this file's
# existing pattern (previously used for macos-arm64 Rust builds): the job
# runs on the one runner this repo has and immediately no-ops with a
# warning, because no runner carrying the `mac` label is registered yet.
# Once one is, flip that job's `runs-on` to `[self-hosted, mac]` and remove
# the no-op guard step — see the job's own comment.
#
# Trigger: push a tag like `v0.1.0`, or run "Release" via workflow_dispatch
# (useful for a dry run / rebuild of the current commit's artifacts without
# cutting a new tag — in that case the release version comes from
# `git describe` instead of a tag name).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release
    runs-on: [self-hosted, darkmirror]
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history/tags for `git describe`

      # ---- frontend: build fresh, fail on drift ----------------------------
      # Same drift check as build.yml's `frontend` job, run again here on
      # purpose: a release must fail if the committed app/public/js/dexel.js
      # bundle doesn't match a fresh build from app/frontend/src, even if
      # build.yml's check on the tagged commit was (for whatever reason)
      # stale or skipped. Post-EMBED-1 this is the last chance to catch it:
      # the bundle is go:embed'd into every shipped binary, so a stale one
      # cannot be noticed or swapped out after the fact.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: npm ci
        working-directory: app/frontend
        run: npm ci

      - name: tsc --noEmit (strict)
        working-directory: app/frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Assert the committed bundle matches a fresh build
        run: |
          if ! git diff --exit-code -- app/public/js/dexel.js app/public/js/dexel.js.map; then
            echo "::error::app/public/js/dexel.js (and/or its .map) is out of date with app/frontend/src/*.ts — a release cannot ship a stale bundle. Run 'npm run build' in app/frontend/ and commit the result." >&2
            exit 1
          fi

      # ---- go: vet + race test ----------------------------------------------
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: go version
        run: go version

      - name: go vet
        working-directory: app
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      # SF-3: same fix as build.yml's `go` job — cgo reads $CC (gcc by
      # default on Linux), not `cc`, so scripts/test-race.sh does the probing,
      # proves the compiler works, and exports CC before running the suite.
      - name: go test -race (scripts/test-race.sh)
        run: bash scripts/test-race.sh

      # ---- version -----------------------------------------------------------
      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      # ---- build + package ----------------------------------------------------
      - name: Build release archives
        env:
          DEXEL_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-release.sh

      - name: List artifacts
        run: |
          ls -la dist/
          echo "--- sha256sums.txt ---"
          cat dist/sha256sums.txt

      # ---- publish -------------------------------------------------------------
      # Same action the previous version of this file used.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: dexel ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GATED: darwin/arm64. No runner carrying the `mac` label is registered
  # for this repo yet, so this job runs on the same runner as everything
  # else and immediately no-ops with a warning rather than attempting a
  # build it cannot produce (darwin requires cgo + a real macOS clang
  # toolchain — see scripts/build-release.sh's header). This mirrors the
  # gating pattern this file used previously for the Rust macos-arm64
  # build, and the pattern docs/plan/F3-design.md §8 T5 calls for future
  # desktop CI jobs to follow too.
  #
  # To activate once a macOS runner is registered:
  #   1. Change `runs-on` below to `[self-hosted, mac]`.
  #   2. Delete the "Skip: no macOS runner registered" step.
  #   3. Uncomment (or write) the real build+upload steps — natively run
  #      `bash scripts/build-release.sh darwin/arm64` on that host, then
  #      upload `dist/dexel-*-darwin-arm64.tar.gz` as an additional release
  #      asset (e.g. via `gh release upload` against the tag the `release`
  #      job above just published, since this job has no matrix/artifact
  #      dependency on it today).
  release-macos:
    name: Build darwin/arm64
    # Runs on the registered macOS self-hosted runner (labels: self-hosted,
    # macOS, ARM64, mac). darwin/arm64 needs cgo + a real macOS clang
    # toolchain (Cocoa/CoreGraphics in internal/activity/provider_darwin.go),
    # so it can only build natively here. `needs: release` waits for the
    # linux/windows job to create the GitHub Release, then this job attaches
    # the darwin archive to that same tag.
    needs: release
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history/tags for `git describe`

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "darwin release version: $version"

      # build-release.sh embeds the COMMITTED app/public bundle via go:embed
      # (no npm build here), and builds darwin/arm64 with CGO_ENABLED=1 using
      # the Mac's own clang.
      - name: Build darwin/arm64 archive
        env:
          DEXEL_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-release.sh darwin/arm64

      - name: List darwin artifact
        run: ls -la dist/

      - name: Attach darwin archive + fold its checksum into sha256sums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # 1. Upload the darwin archive to the release the linux/windows
          #    `release` job already created.
          gh release upload "$VERSION" dist/dexel-*-darwin-arm64.tar.gz --clobber

          # 2. Fold the darwin checksum INTO the release's sha256sums.txt.
          #    That file is generated by the `release` job for the four
          #    linux/windows archives only — it never sees the darwin
          #    archive, which is built here on a different runner. Without
          #    this step the darwin download has no line to verify against
          #    and install.sh refuses it ("sha256sums.txt has no line for
          #    dexel-*-darwin-arm64.tar.gz"). Bare filename (no dist/ prefix)
          #    to match the other lines. Idempotent on re-run: drop any stale
          #    darwin line before appending.
          darwin_line="$(cd dist && sha256sum dexel-*-darwin-arm64.tar.gz)"
          tmp="$(mktemp -d)"
          gh release download "$VERSION" -p sha256sums.txt -D "$tmp"
          grep -v 'darwin-arm64\.tar\.gz$' "$tmp/sha256sums.txt" > "$tmp/sums.new" || true
          printf '%s\n' "$darwin_line" >> "$tmp/sums.new"
          mv "$tmp/sums.new" "$tmp/sha256sums.txt"
          gh release upload "$VERSION" "$tmp/sha256sums.txt" --clobber
          echo "final sha256sums.txt (all targets):"
          cat "$tmp/sha256sums.txt"
