name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs on the self-hosted runner "jwdlab-runner" (labels: self-hosted, Linux,
# X64, darkmirror). The repo is PRIVATE, so GitHub's hosted runners
# (ubuntu-latest / macos-latest) are unavailable — jobs must run on a
# self-hosted runner. Use the `darkmirror` label so the job is pinned to that
# specific machine.
#
# Targets produced here (Linux host):
#   - x86_64-unknown-linux-gnu   (native)
#   - aarch64-unknown-linux-gnu  (cross, via `cross`/Docker — provides the
#     aarch64 glibc sysroot Bevy's wayland/gbm/alsa libs need)
#
# macOS arm64 CANNOT be produced on a Linux runner. That build is included in
# release.yml, gated behind a macOS runner label — it activates once a macOS
# runner (e.g. "mac") is registered. See release.yml.

env:
  CARGO_TERM_COLOR: always

# Self-hosted runners keep their state; clean the workspace when a job ends.
# (Standard hygiene for self-hosted runners.)
jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: [self-hosted, darkmirror]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            cross: false
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # Native x86_64 needs a C linker.
      - name: Install build deps (native x86_64)
        if: matrix.cross == false
        run: |
          if ! command -v cc >/dev/null; then
            (sudo apt-get update && sudo apt-get install -y build-essential) 2>/dev/null \
              || echo "no sudo — relying on an existing cc/zig toolchain"
          fi

      # aarch64 via `cross` (Docker) — provides a real aarch64 toolchain+glibc.
      - name: Install cross
        if: matrix.cross == true
        run: |
          if ! command -v cross >/dev/null; then
            cargo install cross --git https://github.com/cross-rs/cross
          fi
          cross --version

      - name: Build
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }} -p companion

      - name: Build (cross aarch64)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} -p companion

      - name: Show artifact
        run: file target/${{ matrix.target }}/release/companion

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.name }}-${{ github.sha }}
          path: target/${{ matrix.target }}/release/companion
