name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs on the self-hosted runner "jwdlab-runner" (labels: self-hosted, Linux,
# X64, darkmirror). The repo is PRIVATE, so GitHub's hosted runners
# (ubuntu-latest / macos-latest) are unavailable — jobs must run on a
# self-hosted runner. Use the `darkmirror` label so the job is pinned to that
# specific machine.
#
# Three independent jobs live here:
#   - `build` (below): the LEGACY, frozen Rust/Bevy companion crate under
#     companion/ (ADR 0011: superseded by the Go+WS backend under app/, kept
#     buildable only as the one-time legacy-save source the Go backend
#     imports from — see docs/upgrade-design.md). Not where new work lands.
#   - `go`: the ACTUAL current backend under app/ — go vet + a raced test
#     run. This is the job that must be green for any app/ change.
#   - `frontend`: the TypeScript source under app/frontend/ (Frontend
#     architecture track F1, docs/plan/ROADMAP.md) — npm ci, tsc --noEmit,
#     and a fresh esbuild run diffed against the committed
#     app/public/js/dexel.js so the checked-in bundle can never silently
#     drift from its TS source. (The bundle was named game.js before
#     EMBED-1 renamed it after the product.)
#
# Targets produced by `build` (Linux host):
#   - x86_64-unknown-linux-gnu   (native)
#   - aarch64-unknown-linux-gnu  (cross, via `cross`/Docker — provides the
#     aarch64 glibc sysroot Bevy's wayland/gbm/alsa libs need)
#
# macOS arm64 CANNOT be produced on a Linux runner. That build is included in
# release.yml, gated behind a macOS runner label — it activates once a macOS
# runner (e.g. "mac") is registered. See release.yml.

env:
  CARGO_TERM_COLOR: always

# Self-hosted runners keep their state; clean the workspace when a job ends.
# (Standard hygiene for self-hosted runners.)
jobs:
  # LEGACY: the frozen Rust/Bevy companion crate (see the file-level comment
  # above). Kept building so the one-time legacy-save import path
  # (docs/upgrade-design.md) always has a real binary to produce a save
  # with; not where new gameplay work happens anymore.
  build:
    name: "[legacy rust] Build ${{ matrix.name }}"
    runs-on: [self-hosted, darkmirror]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            cross: false
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # Native x86_64 needs a C linker.
      - name: Install build deps (native x86_64)
        if: matrix.cross == false
        run: |
          if ! command -v cc >/dev/null; then
            (sudo apt-get update && sudo apt-get install -y build-essential) 2>/dev/null \
              || echo "no sudo — relying on an existing cc/zig toolchain"
          fi

      # aarch64 via `cross` (Docker) — provides a real aarch64 toolchain+glibc.
      - name: Install cross
        if: matrix.cross == true
        run: |
          if ! command -v cross >/dev/null; then
            cargo install cross --git https://github.com/cross-rs/cross
          fi
          cross --version

      - name: Build
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }} -p companion

      - name: Build (cross aarch64)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} -p companion

      - name: Show artifact
        run: file target/${{ matrix.target }}/release/companion

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.name }}-${{ github.sha }}
          path: target/${{ matrix.target }}/release/companion

  # The current backend (ADR 0011): go vet + a raced test run of everything
  # under app/. CGO is required — internal/store's/handlers' race tests and
  # (on a real darwin runner) provider_darwin.go's cgo all need a working C
  # toolchain, which is why this job installs one the same way the rust
  # `build` job above does (native x86_64 needs a linker too).
  go:
    name: Go (vet + race test)
    runs-on: [self-hosted, darkmirror]
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: go version
        run: go version

      - name: go vet
        working-directory: app
        run: go vet ./...

      # SF-3 (docs/plan/REVIEW-2026-08-22.md): cgo does not look for `cc` — it
      # reads $CC, defaulting to `gcc` on Linux — so the old `command -v cc`
      # guard passed on this runner (a zig shim at ~/.local/bin/cc) and the
      # whole suite then died with `cgo: C compiler "gcc" not found`.
      # scripts/test-race.sh is the fix: it probes gcc/clang/cc, PROVES the
      # compiler can compile a trivial C program, exports CC, and only then
      # runs the suite. Do not re-derive that logic in YAML.
      - name: go test -race (scripts/test-race.sh)
        run: bash scripts/test-race.sh

  # Frontend architecture track F1 (docs/plan/ROADMAP.md): the TypeScript
  # source under app/frontend/ that builds into app/public/js/dexel.js — the
  # bundle every dexel binary serves, and since EMBED-1 the bundle go:embed
  # compiles INTO that binary (app/embed.go), which is exactly why a stale
  # committed bundle must fail CI: it would be baked into a release
  # invisibly. That bundle is committed deliberately (see
  # app/frontend/README.md "Why the bundle is committed"), so this job's
  # real job is to prove it hasn't drifted from source: a fresh `npm run
  # build` must reproduce the committed file byte-for-byte.
  frontend:
    name: Frontend (typecheck + build + drift check)
    runs-on: [self-hosted, darkmirror]
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: npm ci
        working-directory: app/frontend
        run: npm ci

      - name: tsc --noEmit (strict)
        working-directory: app/frontend
        run: npm run typecheck

      - name: Build
        working-directory: app/frontend
        run: npm run build

      - name: Assert the committed bundle matches a fresh build
        run: |
          if ! git diff --exit-code -- app/public/js/dexel.js app/public/js/dexel.js.map; then
            echo "::error::app/public/js/dexel.js (and/or its .map) is out of date with app/frontend/src/*.ts — run 'npm run build' in app/frontend/ and commit the result." >&2
            exit 1
          fi
