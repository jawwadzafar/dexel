name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs on the self-hosted runner "jwdlab-runner" (labels: self-hosted, Linux,
# X64, darkmirror). The repo is PRIVATE, so GitHub's hosted runners
# (ubuntu-latest / macos-latest) are unavailable — jobs must run on a
# self-hosted runner. Use the `darkmirror` label so the job is pinned to that
# specific machine.
#
# Two independent jobs live here:
#   - `go`: the current backend under app/ — go vet + a raced test run via
#     scripts/test-race.sh. This is the job that must be green for any app/
#     change.
#   - `frontend`: the TypeScript source under app/frontend/ (Frontend
#     architecture track F1, docs/plan/ROADMAP.md) — npm ci, tsc --noEmit,
#     and a fresh esbuild run diffed against the committed
#     app/public/js/dexel.js so the checked-in bundle can never silently
#     drift from its TS source. (The bundle was named game.js before
#     EMBED-1 renamed it after the product.)
#
# There used to be a third job, `[legacy rust] Build`, compiling the frozen
# Rust/Bevy `companion` crate for two Linux targets on every push. Its own
# purpose — keeping a binary around that could produce a legacy save for the
# Go backend to import — died when review item B-2 deleted the importer, so
# the crates are archived on branch `attic/legacy-rust-and-fleet` and the job
# is gone (ADR 0020, docs/plan/REPO-STRUCTURE-AUDIT.md).
#
# macOS arm64 CANNOT be produced on a Linux runner; the macOS release build
# lives in release.yml behind a macOS runner label. See release.yml.

# Self-hosted runners keep their state; clean the workspace when a job ends.
# (Standard hygiene for self-hosted runners.)
jobs:
  # The current backend (ADR 0011): go vet + a raced test run of everything
  # under app/. CGO is required — internal/store's/handlers' race tests and
  # (on a real darwin runner) provider_darwin.go's cgo all need a working C
  # toolchain, which is why the race step goes through scripts/test-race.sh:
  # it finds a compiler, proves it works, and exports CC (SF-3).
  go:
    name: Go (vet + race test)
    runs-on: [self-hosted, darkmirror]
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: go version
        run: go version

      - name: go vet
        working-directory: app
        run: go vet ./...

      # SF-3 (docs/plan/REVIEW-2026-08-22.md): cgo does not look for `cc` — it
      # reads $CC, defaulting to `gcc` on Linux — so the old `command -v cc`
      # guard passed on this runner (a zig shim at ~/.local/bin/cc) and the
      # whole suite then died with `cgo: C compiler "gcc" not found`.
      # scripts/test-race.sh is the fix: it probes gcc/clang/cc, PROVES the
      # compiler can compile a trivial C program, exports CC, and only then
      # runs the suite. Do not re-derive that logic in YAML.
      - name: go test -race (scripts/test-race.sh)
        run: bash scripts/test-race.sh

  # Frontend architecture track F1 (docs/plan/ROADMAP.md): the TypeScript
  # source under app/frontend/ that builds into app/public/js/dexel.js — the
  # bundle every dexel binary serves, and since EMBED-1 the bundle go:embed
  # compiles INTO that binary (app/embed.go), which is exactly why a stale
  # committed bundle must fail CI: it would be baked into a release
  # invisibly. That bundle is committed deliberately (see
  # app/frontend/README.md "Why the bundle is committed"), so this job's
  # real job is to prove it hasn't drifted from source: a fresh `npm run
  # build` must reproduce the committed file byte-for-byte.
  frontend:
    name: Frontend (typecheck + build + drift check)
    runs-on: [self-hosted, darkmirror]
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: npm ci
        working-directory: app/frontend
        run: npm ci

      - name: tsc --noEmit (strict)
        working-directory: app/frontend
        run: npm run typecheck

      - name: Build
        working-directory: app/frontend
        run: npm run build

      - name: Assert the committed bundle matches a fresh build
        run: |
          if ! git diff --exit-code -- app/public/js/dexel.js app/public/js/dexel.js.map; then
            echo "::error::app/public/js/dexel.js (and/or its .map) is out of date with app/frontend/src/*.ts — run 'npm run build' in app/frontend/ and commit the result." >&2
            exit 1
          fi
