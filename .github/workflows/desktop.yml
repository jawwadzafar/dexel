name: Desktop

# The Tauri desktop pipeline (ADR 0015 / docs/plan/F3-design.md task T5):
# package dexel as a native app by bundling the Go server as a Tauri sidecar.
#
# ------------------------------------------------------------------------
# READ THIS BEFORE WONDERING WHY NOTHING BUILT
# ------------------------------------------------------------------------
# Tauri BUNDLING is host-OS-bound: Linux bundles are built on Linux, macOS on
# macOS, Windows on Windows. There is no honest "one job builds all three".
# The Go sidecar cross-compiles from anywhere; the installer does not.
#
# So this workflow has three jobs with very different status:
#
#   sidecar        ACTIVE. Runs on the existing `darkmirror` runner on every
#                  push/PR. Cross-compiles the Go server for every non-darwin
#                  target triple and proves scripts/build-sidecar.sh still
#                  produces correctly-named externalBin artifacts. This is
#                  the part that works today.
#
#   desktop-linux  DORMANT. Needs a runner labelled `desktop-linux` — i.e. a
#                  Linux machine with webkit2gtk-4.1-dev and the rest of
#                  Tauri's Linux deps installed. The existing `darkmirror`
#                  runner does NOT have them (and installing them needs root
#                  on that box), which is exactly why this is a separate
#                  label rather than reusing `darkmirror`.
#
#   desktop-macos  DORMANT. Needs a runner labelled `mac` (F3-design.md
#                  FORK 1 recommends registering the owner's own Mac —
#                  macOS is the primary platform per ADR 0010 and the
#                  hardware already exists). Mirrors release.yml's `mac`
#                  gate concept.
#
# ------------------------------------------------------------------------
# HOW TO ACTIVATE A DORMANT JOB (both steps are required)
# ------------------------------------------------------------------------
# 1. Register the runner with the matching label (`desktop-linux` or `mac`).
# 2. Set the repository variable that ungates the job:
#       gh variable set DESKTOP_LINUX_RUNNER --body true
#       gh variable set MAC_RUNNER --body true
#    (Settings -> Secrets and variables -> Actions -> Variables.)
#
# Why a variable AND a label: GitHub Actions cannot ask "does a runner with
# this label exist?". A job whose `runs-on` names a label no runner has does
# not fail — it sits Queued forever and eventually times out, which looks
# like a broken pipeline. The `if:` gate on a repository variable makes the
# job cleanly SKIPPED instead, so "dormant" means dormant. Today neither
# variable is set, so both bundle jobs are skipped by design.
#
# Windows is deliberately absent: no Windows machine is available as a
# runner, and the repo is private so GitHub-hosted runners are not free
# (F3-design.md §4, Phase 2/3).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------
  # ACTIVE: the half of the desktop build that is host-independent.
  # ----------------------------------------------------------------------
  sidecar:
    name: Sidecar (cross-compile the Go server)
    runs-on: [self-hosted, darkmirror]
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Every non-darwin target builds with CGO_ENABLED=0 (their providers are
      # pure Go), so no C toolchain is needed here. The darwin targets need
      # cgo for the real macOS provider and are skipped by the script on a
      # non-mac host — see desktop-macos below, which builds them on the Mac.
      - name: Cross-compile every non-darwin sidecar
        run: scripts/build-sidecar.sh --all

      # FOUR assertions, because any three of them can pass while the
      # arrangement is only half right:
      #
      #   1. No two executables destined for one flat install directory
      #      collide CASE-INSENSITIVELY. This is the real invariant and it
      #      is the one that was unenforced twice. See the step's own
      #      comment for why there is no build error to rely on.
      #   2. tauri.conf.json's externalBin entry is the string we think it
      #      is, and capabilities/default.json's shell:allow-execute scope
      #      entry agrees with it. Without this, the filename list below
      #      could be "corrected" to match a config nobody checked, and the
      #      job would go green while the bundler found no sidecar.
      #   3. Every triple-suffixed artifact Tauri will look for exists.
      #   4. No artifact under a PREVIOUS name is left lying around, so a
      #      half-finished rename cannot be masked by a stale build.
      #
      # $BASE may contain a SPACE. It does not today ("Dexel"), but it did
      # for the whole "Dexel Runtime" generation and it is display text, so
      # it can again -- see scripts/build-sidecar.sh's header for why that
      # name is display text at all. That is why the list below is a quoted
      # bash array and the loop is `for f in "${expected[@]}"`: the
      # `for f in $expected` word-split loop this replaced would read one
      # filename as two, find neither, and -- because the missing halves
      # would be reported as separate names -- invite someone to "fix" the
      # list instead of the quoting. Do not un-quote anything here.
      - name: Assert no two bundled executables collide case-insensitively
        run: |
          set -euo pipefail
          conf=desktop/src-tauri/tauri.conf.json

          # ------------------------------------------------------------
          # THE INVARIANT: every executable this config places in ONE flat
          # directory must be distinct even after case folding.
          #
          # On macOS they all land in Dexel.app/Contents/MacOS/; in the
          # .deb they all land in /usr/bin; in the NSIS installer they all
          # land in the install directory. macOS's default APFS volume is
          # case-insensitive and Windows always is, so a colliding pair is
          # ONE FILE.
          #
          # There is no build error to lean on -- checked in the vendored
          # tauri-bundler 2.9.4 rather than assumed:
          #   * macos/app.rs's bundle_project calls copy_binaries (the
          #     externalBin entries) and THEN copy_binaries_to_bundle (the
          #     main binary);
          #   * linux/debian.rs's generate_data does it in the OPPOSITE
          #     order;
          #   * both end in utils/fs_utils.rs's copy_file, whose body is
          #     `fs::create_dir_all(dest_dir)?; fs::copy(from, to)?` -- an
          #     overwrite that returns Ok.
          # So a collision ships a bundle missing one of its two programs,
          # exit code 0, no warning, and WHICH program survives differs by
          # target. On macOS the survivor is the GUI shell, which means the
          # login item opens a WINDOW at every login instead of starting
          # the runtime. PLATFORM_NOTES.md §3.1.3 has the field account.
          #
          # sed, not jq/python: this runner is only guaranteed a Go
          # toolchain. The extraction is self-checking -- if the file is
          # ever reformatted so that the one-entry-per-line assumption
          # breaks, the count cross-check below fails loudly instead of
          # silently enumerating nothing.
          # ------------------------------------------------------------
          main=$(sed -n 's/.*"mainBinaryName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$conf")
          if [ -z "$main" ]; then
            echo "::error::$conf does not state \"mainBinaryName\". Without it the main binary silently takes the Cargo package name, which is how the collision this step guards against happened in the first place." >&2
            exit 1
          fi

          # Every externalBin entry, read from inside the array's own
          # sed range so a "binaries/..." string elsewhere in the file
          # cannot be mistaken for one.
          mapfile -t external < <(
            sed -n '/"externalBin"[[:space:]]*:[[:space:]]*\[/,/\]/p' "$conf" |
              sed -n 's/.*"binaries\/\([^"]*\)".*/\1/p'
          )
          # grep -o, not grep -c: -c counts LINES, so two array entries on
          # ONE line would agree with a one-entry extraction and let a whole
          # executable through unchecked. Occurrences are what must match.
          total=$(grep -o '"binaries/' "$conf" | wc -l | tr -d ' ')
          if [ "${#external[@]}" -eq 0 ] || [ "${#external[@]}" -ne "$total" ]; then
            echo "::error::extracted ${#external[@]} externalBin entries from $conf but the file contains $total \"binaries/\" occurrences. The extraction above assumes at most one array element per line; $conf has been reformatted, so FIX THIS STEP rather than assuming it still checks anything." >&2
            exit 1
          fi

          names=("$main" "${external[@]}")
          printf 'checking %d executable name(s) destined for one directory:\n' "${#names[@]}"
          printf '  %s\n' "${names[@]}"

          # Folded duplicates. The names may contain spaces but never
          # newlines, so a line-oriented sort|uniq is safe.
          dupes=$(printf '%s\n' "${names[@]}" | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::these executable names collide case-insensitively: $(echo "$dupes" | tr '\n' ' '). All of them land in Dexel.app/Contents/MacOS/ (and in /usr/bin for the .deb), which is case-insensitive by default, so they are ONE FILE -- and tauri-bundler overwrites with a plain fs::copy WITHOUT erroring. Rename one of them. See desktop/src-tauri/Cargo.toml's [package] header and PLATFORM_NOTES.md §3.1.3." >&2
            exit 1
          fi
          echo "ok  no case-insensitive collision among ${#names[@]} name(s)"

          # The same invariant is a unit test in the Rust crate
          # (`mod bundle_layout` in desktop/src-tauri/src/lib.rs), which is
          # the copy that fails locally before anyone pushes. This step is
          # the copy that runs on THIS job, which is the only one active on
          # every push -- the crate's tests need a Rust toolchain and a
          # built sidecar, and the two bundle jobs are dormant.
          echo "ok  (mirrors mod bundle_layout in desktop/src-tauri/src/lib.rs)"

      - name: Assert the externalBin names are exactly what Tauri looks for
        run: |
          set -euo pipefail
          BASE="Dexel"

          # (2) The config and the ACL must both name $BASE. grep -F, so
          # nothing in the string is read as a pattern, and no jq/python
          # dependency on the runner.
          for cfg in desktop/src-tauri/tauri.conf.json desktop/src-tauri/capabilities/default.json; do
            if ! grep -qF "\"binaries/$BASE\"" "$cfg"; then
              echo "::error::$cfg does not contain \"binaries/$BASE\" — this assertion and the config have drifted apart, so the filename check below is asserting the wrong names. Fix whichever one is wrong; do not just edit this workflow." >&2
              exit 1
            fi
            echo "ok  $cfg names binaries/$BASE"
          done

          cd desktop/src-tauri/binaries

          # (3) Every non-darwin artifact, by the exact name Tauri derives
          # (<base>-<target triple>[.exe]). The darwin pair is built on the
          # Mac (see desktop-macos below), not here.
          expected=(
            "$BASE-aarch64-pc-windows-msvc.exe"
            "$BASE-aarch64-unknown-linux-gnu"
            "$BASE-x86_64-pc-windows-msvc.exe"
            "$BASE-x86_64-unknown-linux-gnu"
          )
          for f in "${expected[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing sidecar '$f' — bundle.externalBin resolves 'binaries/$BASE-<target triple>', so a wrong name silently becomes 'no sidecar for this target' at bundle time." >&2
              exit 1
            fi
            echo "ok  $f  ($(file -b "$f" | cut -c1-60))"
          done

          # (4) Nothing under either retired name. If build-sidecar.sh and
          # the config disagree this is the assertion that says so out loud
          # rather than shipping a bundle with two daemons in it.
          # build-sidecar.sh purges these itself
          # (PREVIOUS_BIN_BASES/purge_previous_names), so a hit here means
          # the script did not run, or its list and $BASE have drifted.
          #
          # These globs are matched case-sensitively against real directory
          # entries, and neither retired name is a case-variant of "$BASE"
          # -- both carry a suffix ("-server", " Runtime") that "$BASE"
          # alone does not -- so this cannot match the artifact just built.
          for retired in "Dexel Runtime" "dexel-server"; do
            if compgen -G "$retired-*" >/dev/null; then
              echo "::error::found artifact(s) under the retired name '$retired-*': $(echo "$retired"-*). The sidecar is '$BASE' now (PLATFORM_NOTES.md §3.1.3); a stale artifact means scripts/build-sidecar.sh and tauri.conf.json have drifted." >&2
              exit 1
            fi
            echo "ok  no '$retired-*' artifacts"
          done

      # The one behaviour the whole desktop shell depends on: the Go server
      # must print `DEXEL_LISTENING http://127.0.0.1:<port>` on stdout once
      # bound. src-tauri/src/lib.rs parses exactly that prefix, so a change
      # to it would break the app while every Go unit test stayed green.
      #
      # Run the binary bare — no -public, no $DEXEL_ASSETS_DIR — from an
      # empty temp dir, so it can only serve what EMBED-1 actually baked
      # into it (app/main.go's embed.go). Passing
      # DEXEL_ASSETS_DIR="$PWD/assets" -public "$PWD/app/public" here (as
      # this step used to) points at paths that no longer exist post-
      # EMBED-1 and post-move-to-app/assets/, so it silently served 404s
      # for every asset without this step ever noticing. Asserting
      # /assets/room_back.png (a real sprite shipped in app/assets/) is
      # what actually catches an embed regression.
      - name: Verify the DEXEL_LISTENING handshake and embedded assets on the linux sidecar
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          # The SOURCE name is the renamed artifact; the temp copy is
          # deliberately still called dexel-server, because that local
          # filename is the `./dexel-server -addr ...` invocation
          # app/cli.go's dispatch-table docs and app/cli_test.go cite by
          # file:line. It is a scratch filename in a temp dir, not the
          # bundled artifact, so renaming it would only invalidate those
          # references.
          cp "desktop/src-tauri/binaries/Dexel-x86_64-unknown-linux-gnu" "$tmp/dexel-server"
          chmod +x "$tmp/dexel-server"
          log=$(mktemp)
          ( cd "$tmp" && exec ./dexel-server -addr 127.0.0.1:0 -provider fake ) >"$log" 2>/dev/null &
          pid=$!
          for _ in $(seq 1 50); do [ -s "$log" ] && break; sleep 0.1; done
          line=$(head -n1 "$log")
          echo "handshake line: $line"
          url=${line#DEXEL_LISTENING }
          if [ "$url" = "$line" ]; then
            echo "::error::stdout did not start with 'DEXEL_LISTENING ' (got: $line)" >&2
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          case "$url" in
            http://127.0.0.1:*) ;;
            *) echo "::error::handshake URL is not loopback: $url" >&2
               kill "$pid" 2>/dev/null || true; exit 1 ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/")
          echo "GET $url/ -> $code"
          [ "$code" = "200" ] || { kill "$pid" 2>/dev/null || true; exit 1; }
          asset_code=$(curl -s -o /dev/null -w '%{http_code}' "$url/assets/room_back.png")
          echo "GET $url/assets/room_back.png -> $asset_code"
          [ "$asset_code" = "200" ] || { echo "::error::embedded asset not served — /assets/room_back.png returned $asset_code (embed regression, or the binary fell back to a disk path that doesn't exist in this empty temp dir)" >&2; kill "$pid" 2>/dev/null || true; exit 1; }
          # SIGTERM is the signal the shell sends on unix so main.go persists
          # state on the way out; assert the process honours it.
          kill -TERM "$pid"
          wait "$pid" || { echo "::error::sidecar did not exit 0 on SIGTERM" >&2; exit 1; }
          echo "SIGTERM honoured, clean exit"

      - name: Upload sidecar binaries
        uses: actions/upload-artifact@v4
        with:
          name: dexel-sidecars-${{ github.sha }}
          path: desktop/src-tauri/binaries/
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # DORMANT: needs a Linux runner with Tauri's webview deps.
  # ----------------------------------------------------------------------
  desktop-linux:
    name: Linux bundle (AppImage + .deb)
    # See the header: the label alone would queue forever, so the variable is
    # what actually ungates the job.
    if: vars.DESKTOP_LINUX_RUNNER == 'true'
    runs-on: [self-hosted, desktop-linux]
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version && cargo --version

      # Exactly the list from https://v2.tauri.app/start/prerequisites/.
      # A runner carrying the `desktop-linux` label is expected to have these
      # already; this step is the self-heal path when it does not.
      - name: Install Tauri Linux deps
        run: |
          if ! pkg-config --exists webkit2gtk-4.1; then
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev build-essential curl wget file \
              libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          fi
          pkg-config --modversion webkit2gtk-4.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux
          workspaces: desktop/src-tauri

      - name: Install tauri-cli
        run: |
          if ! command -v cargo-tauri >/dev/null; then
            cargo install tauri-cli --version "^2.0.0" --locked
          fi
          cargo tauri --version

      # The Go sidecar embeds app/public and app/assets at build time
      # (EMBED-1) — there is no bundle.resources shipping app/public
      # verbatim any more, and no separate resource tree for Tauri to
      # bundle. What still must be current is app/public/js/dexel.js
      # itself, since that's what scripts/build-sidecar.sh compiles into
      # the sidecar binary this job just built above — the same invariant
      # build.yml's drift check enforces on every push.
      - name: Build the frontend bundle
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Assert the committed bundle did not drift
        run: |
          git diff --exit-code -- app/public/js/dexel.js app/public/js/dexel.js.map \
            || { echo "::error::app/public/js/dexel.js is stale; run 'npm run build' in app/frontend/ and commit." >&2; exit 1; }

      - name: Build the sidecar for this host
        run: scripts/build-sidecar.sh x86_64-unknown-linux-gnu

      # Explicit --bundles rather than tauri.conf.json's "all": "all" would
      # also try rpm, which needs rpmbuild on the runner.
      - name: cargo tauri build
        working-directory: desktop
        run: cargo tauri build --bundles appimage,deb

      - name: Show what was produced
        run: find desktop/src-tauri/target/release/bundle -maxdepth 2 -type f | sort

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: dexel-linux-x86_64-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # DORMANT: needs a macOS runner (label `mac`).
  # ----------------------------------------------------------------------
  desktop-macos:
    name: macOS bundle (.app + .dmg)
    if: vars.MAC_RUNNER == 'true'
    runs-on: [self-hosted, mac]
    steps:
      - name: Clean workspace
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-macos
          workspaces: desktop/src-tauri

      - name: Install tauri-cli
        run: |
          if ! command -v cargo-tauri >/dev/null; then
            cargo install tauri-cli --version "^2.0.0" --locked
          fi
          cargo tauri --version

      - name: Build the frontend bundle
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Assert the committed bundle did not drift
        run: |
          git diff --exit-code -- app/public/js/dexel.js app/public/js/dexel.js.map \
            || { echo "::error::app/public/js/dexel.js is stale; run 'npm run build' in app/frontend/ and commit." >&2; exit 1; }

      # On a Mac the script builds the darwin sidecars WITH cgo, so the
      # bundled server has the real ADR 0011 CGEventSource capture path
      # rather than the blind fallback a CGO_ENABLED=0 cross-build would give.
      - name: Build the darwin sidecar for this host
        run: scripts/build-sidecar.sh

      - name: cargo tauri build
        working-directory: desktop
        run: cargo tauri build --bundles app,dmg

      - name: Show what was produced
        run: find desktop/src-tauri/target/release/bundle -maxdepth 2 | sort

      # UNSIGNED and UNNOTARIZED (F3-design.md §6): Gatekeeper will warn on
      # another machine. Signing needs a paid Apple Developer cert the owner
      # must supply and is tracked as a follow-up, not a blocker for Phase 2.
      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: dexel-macos-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # Always runs, so a workflow run reports the real packaging status instead
  # of looking mysteriously empty when both bundle jobs are skipped.
  # ----------------------------------------------------------------------
  status:
    name: Packaging status
    runs-on: [self-hosted, darkmirror]
    needs: [sidecar]
    if: always()
    steps:
      - name: Report which bundles this repo can currently produce
        run: |
          echo "sidecar cross-compile : ${{ needs.sidecar.result }}"
          if [ "${{ vars.DESKTOP_LINUX_RUNNER }}" = "true" ]; then
            echo "linux bundle          : enabled"
          else
            echo "::warning::Linux bundle SKIPPED — no runner labelled 'desktop-linux' is registered (needs webkit2gtk-4.1-dev). Set the repo variable DESKTOP_LINUX_RUNNER=true once one exists."
          fi
          if [ "${{ vars.MAC_RUNNER }}" = "true" ]; then
            echo "macOS bundle          : enabled"
          else
            echo "::warning::macOS bundle SKIPPED — no runner labelled 'mac' is registered. Register the owner's Mac (F3-design.md FORK 1) and set MAC_RUNNER=true."
          fi
          echo "::warning::Windows bundle is not implemented — no Windows runner exists and the repo is private (F3-design.md §4, Phase 2/3)."
