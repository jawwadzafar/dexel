# dexel desktop shell — the Tauri v2 native window around the existing Go
# server (ADR 0015 / docs/plan/F3-design.md task T1).
#
# STATUS: BUILT. First compiled and bundled on macOS arm64 (2026-08-23);
# `cargo tauri build --bundles app` produces a launchable Dexel.app. See
# ../README.md for what that first build confirmed.

[package]
# ----------------------------------------------------------------------
# THREE NAMES, AND WHICH FILE EACH ONE PRODUCES
# ----------------------------------------------------------------------
# This crate's package name, tauri.conf.json's `productName`, and
# tauri.conf.json's `mainBinaryName` are three different strings on
# purpose. Getting them confused once cost a silent, build-error-free
# bundle corruption (see below), so the arrangement is written out here in
# full rather than left to be re-derived.
#
#   package name        "dexel"          -> the crate, the lockfile, and
#                                          cargo's own target/release/dexel
#                                          before the bundler renames it
#   productName         "Dexel"          -> `Dexel.app`, CFBundleName and
#                                          CFBundleDisplayName: everything
#                                          a human reads in the Dock, the
#                                          menu bar and Finder
#   mainBinaryName      "dexel-desktop"  -> `Dexel.app/Contents/MacOS/
#                                          dexel-desktop`, and
#                                          CFBundleExecutable
#
# Mechanically (tauri-cli 2.11's `get_binaries`/`rename_app`, and
# tauri-bundler 2.9's `Settings::main_binary_name`): the main binary's name
# comes from THIS package name unless `mainBinaryName` overrides it — it
# does NOT default to productName. tauri.conf.json therefore states
# `mainBinaryName` explicitly, so the contract is a statement rather than
# a side effect of the Cargo package name, and stays correct if this
# package is ever renamed.
#
# # The artifacts-stay-lowercase contract, and its ONE exception
#
# The product is spelled "Dexel" wherever a human reads it, and every
# ARTIFACT is spelled lowercase `dexel`: this crate, the `dexel` CLI,
# `~/.local/bin/dexel`, and — since the rename recorded below —
# `dexel-desktop`, the GUI shell this crate builds.
#
# There is exactly ONE exception, and it is deliberate: the bundled Go
# daemon is named `Dexel`, with a capital D
# (tauri.conf.json's `bundle.externalBin`, `SIDECAR_NAME` in src/lib.rs,
# `BIN_BASE` in ../../scripts/build-sidecar.sh). It is the one artifact
# whose FILENAME is display text — macOS's System Settings → General →
# Login Items & Extensions pane names each background item after the
# executable that is actually exec'd, and `dexel autostart enable` points
# its LaunchAgent at that file inside the installed `Dexel.app`. So that
# filename is what the owner reads in that pane.
# docs/production-runtime/PLATFORM_NOTES.md §3.1.2–§3.1.3 has the
# whole account, including the two earlier names (`dexel-server`, then
# `Dexel Runtime`) and what the pane showed for each.
#
# # Why the MAIN binary is `dexel-desktop` and not `dexel`
#
# Because the daemon needs the name `Dexel`, and `Contents/MacOS/` is one
# flat directory on a volume that is case-INsensitive by default: `Dexel`
# and `dexel` are the SAME FILE there. Worse, the collision does not
# error. tauri-bundler's macOS path copies external binaries first
# (`Settings::copy_binaries`) and the main binary second
# (`copy_binaries_to_bundle`), both with a plain `fs::copy`, so the Rust
# GUI shell would silently overwrite the Go daemon and every login would
# open a WINDOW instead of starting a runtime. (The .deb path copies them
# in the OPPOSITE order into `/usr/bin`, so which program survives a
# collision is not even stable across targets — another reason to make the
# names distinct rather than to reason about who wins.)
#
# `dexel-desktop` is not a new name invented for this: it is already the
# product's word for this exact artifact — `app/cmd_lifecycle.go`'s
# `desktopAppName`, ARCHITECTURE.md Decision 17, PLATFORM_NOTES.md §1's
# "desktop app" row and RUN-MODES.md all call the optional window
# `dexel-desktop`, and `dexel open` looks for precisely that filename on
# `PATH`. The rename makes the bundle agree with the rest of the product
# instead of shipping a `dexel` that shadows the CLI of the same name
# (which the .deb, whose main binary and sidecar share `/usr/bin`, would
# have done literally).
#
# What it costs, stated honestly: `Foo.app/Contents/MacOS/Foo` is Apple's
# convention, and this bundle no longer follows it for its main binary.
# Nothing user-visible changes — `CFBundleName`/`CFBundleDisplayName` are
# still "Dexel", and `CFBundleExecutable` (which LaunchServices, and
# therefore `open -a`, actually reads) is authoritative — so the Dock, the
# menu bar and Finder all still say Dexel. Only a raw process listing
# (Activity Monitor, `ps`) shows `dexel-desktop`.
#
# # The invariant, and where it is enforced
#
# The real rule underneath all of the above is: **no two executables
# destined for one flat install directory may collide case-insensitively.**
# That was unenforced and cost real debugging twice. It is now a test —
# `mod bundle_layout` in src/lib.rs reads this crate's own
# tauri.conf.json and fails on a colliding config — plus a matching
# assertion in .github/workflows/desktop.yml, which is the one that runs
# on a push that touches only the JSON.
name = "dexel"
version = "0.1.0"
description = "dexel — a developer companion that earns Dev Cash from your real activity"
authors = ["Jawwad Zafar"]
edition = "2021"
# tauri-plugin-shell 2.x documents a 1.77.2 MSRV; Tauri v2 itself is >= that.
rust-version = "1.77.2"
license = "MIT"

# An explicit, EMPTY workspace table. The repository root used to hold a
# workspace (members: activity/, companion/, tools/shotcap — the legacy
# Bevy/Rust track, archived on branch attic/legacy-rust-and-fleet by ADR 0020),
# and without this table cargo refused to build here with "current package
# believes it's in a workspace when it's not". Keep it: it is what guarantees
# this Tauri build's lockfile, feature resolution and target/ directory stay
# independent of any workspace anyone adds above it.
[workspace]

[lib]
# The v2 template convention: a thin binary (src/main.rs) over a library
# that holds the real code, so the same run() is reachable from a mobile
# entry point later without restructuring.
name = "dexel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The sidecar API (app.shell().sidecar(..)) lives in the shell plugin:
# https://v2.tauri.app/develop/sidecar/
tauri-plugin-shell = "2"
# So a packaged crash is diagnosable: the plugin's DEFAULT targets are
# exactly [Stdout, LogDir { file_name: None }], which is what we want —
# sidecar stdout/stderr is forwarded into it (F3-design.md §1).
tauri-plugin-log = "2"
log = "0.4"
# For reading `dexel-server status --json`, the shell's only way of finding
# the runtime it attaches to (src/lib.rs). Already in the tree via tauri.
serde_json = "1"

# NOTE: there is deliberately no libc dependency any more. It existed solely
# to SIGTERM a sidecar this shell owned; the shell no longer owns or
# terminates any server process (see src/lib.rs's "The window is a VIEW"
# section), so there is nothing left to signal.
