# dexel desktop shell — the Tauri v2 native window around the existing Go
# server (ADR 0015 / docs/plan/F3-design.md task T1).
#
# STATUS: BUILT. First compiled and bundled on macOS arm64 (2026-08-23);
# `cargo tauri build --bundles app` produces a launchable Dexel.app. See
# ../README.md for what that first build confirmed.

[package]
# The package name is "dexel", lowercase, and it STAYS lowercase even though
# tauri.conf.json's productName is now "Dexel" (the display name: the bundle
# directory, CFBundleName, and the macOS app menu). Those two are allowed to
# differ, and here they must:
#
#   * The product is spelled "Dexel" wherever a human reads it.
#   * Every ARTIFACT is spelled "dexel" — this crate, the compiled binary,
#     the `dexel` CLI, the `dexel-server` sidecar, `~/.local/bin/dexel`.
#
# Mechanically (tauri-cli 2.11's `get_binaries` / `rename_app`, and
# tauri-bundler's `Settings::main_binary_name`): the main binary's name comes
# from THIS package name unless `mainBinaryName` overrides it — it does NOT
# default to productName, despite what an earlier version of this comment
# claimed. tauri.conf.json therefore sets `mainBinaryName: "dexel"`
# explicitly. That makes the contract a statement rather than a side effect of
# the Cargo package name, and it keeps `Dexel.app/Contents/MacOS/dexel`
# (CFBundleExecutable `dexel`) correct if this package is ever renamed.
name = "dexel"
version = "0.1.0"
description = "dexel — a developer companion that earns Dev Cash from your real activity"
authors = ["Jawwad Zafar"]
edition = "2021"
# tauri-plugin-shell 2.x documents a 1.77.2 MSRV; Tauri v2 itself is >= that.
rust-version = "1.77.2"
license = "MIT OR Apache-2.0"

# An explicit, EMPTY workspace table. The repository root Cargo.toml is a
# workspace (members: activity/, companion/, tools/shotcap — the legacy
# Bevy/Rust track). Without this table cargo would refuse to build here
# with "current package believes it's in a workspace when it's not".
# Declaring our own workspace root also keeps this Tauri build's lockfile,
# feature resolution and target/ directory fully independent of that track.
[workspace]

[lib]
# The v2 template convention: a thin binary (src/main.rs) over a library
# that holds the real code, so the same run() is reachable from a mobile
# entry point later without restructuring.
name = "dexel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The sidecar API (app.shell().sidecar(..)) lives in the shell plugin:
# https://v2.tauri.app/develop/sidecar/
tauri-plugin-shell = "2"
# So a packaged crash is diagnosable: the plugin's DEFAULT targets are
# exactly [Stdout, LogDir { file_name: None }], which is what we want —
# sidecar stdout/stderr is forwarded into it (F3-design.md §1).
tauri-plugin-log = "2"
log = "0.4"
# For reading `dexel-server status --json`, the shell's only way of finding
# the runtime it attaches to (src/lib.rs). Already in the tree via tauri.
serde_json = "1"

# NOTE: there is deliberately no libc dependency any more. It existed solely
# to SIGTERM a sidecar this shell owned; the shell no longer owns or
# terminates any server process (see src/lib.rs's "The window is a VIEW"
# section), so there is nothing left to signal.
