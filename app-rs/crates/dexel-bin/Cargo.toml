[package]
name = "dexel-bin"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "dexel-bin"
path = "src/main.rs"

[dependencies]
# The plan's §2.1 probe dependency surface, so the cross-compile matrix
# measured here reflects the crates app-rs/ would plausibly use, not a
# toy hello-world.
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
rust-embed = "8"
dirs = "5"
