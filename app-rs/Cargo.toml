# app-rs — the parallel Rust implementation of the Go dexel server
# (dev_docs/rust-port-evaluation.md, §5.0).
#
# This is its OWN workspace root, exactly like desktop/src-tauri/Cargo.toml,
# and originally for the same reason: the repository root Cargo.toml was a
# workspace whose members were the frozen Bevy track (activity/, companion/,
# tools/shotcap/) — a 566-crate / 70 GiB tree. That workspace is archived on
# branch attic/legacy-rust-and-fleet (ADR 0020), so nothing sits above this
# file today; the [workspace] table stays because it is what stops cargo's
# upward search and keeps this crate's lockfile, feature resolution and
# target/ independent of whatever anyone adds above it later.
#
# P0a scope only: a single dexel-bin crate exercising the crates the plan's
# §2.1 probe used (tiny_http, rust-embed, serde_json, rusqlite bundled,
# hmac, sha2), for the cross-compile matrix probe. §5.0's full crate split
# (dexel-store / dexel-engine / dexel-game / dexel-activity / dexel-bin)
# is P1+ scope, not created yet.
[workspace]
resolver = "2"
members = ["crates/dexel-bin"]

[workspace.package]
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
